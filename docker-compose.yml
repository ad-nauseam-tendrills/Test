services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: instaopt
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    # All backend configuration -- including Meta credentials -- lives in
    # backend/.env. Copy backend/.env.example to backend/.env before the
    # first `docker compose up`; compose fails fast if it is missing.
    env_file:
      - ./backend/.env
    environment:
      # Docker-specific values that must override whatever backend/.env
      # says, since those point at host paths / localhost for non-Docker
      # development.
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/instaopt
      UPLOAD_DIR: /app/storage/uploads
      VARIANT_DIR: /app/storage/variants
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - backend_storage:/app/storage

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  db_data:
  backend_storage:
